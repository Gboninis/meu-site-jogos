<!DOCTYPE html>
<html>
<head>
    <title>Emulator Test</title>
</head>
<body style="background:black;margin:0;">
    <!-- Mudamos o ID para testar se o JS está travado num nome específico -->
    <div id="game-container" style="width:100vw;height:100vh;"></div>

    <script>
        // Forçamos a configuração do emulador a usar o novo ID
        window.EJS_player = {
            gameUrl: new URLSearchParams(window.location.search).get('game'),
            core: new URLSearchParams(window.location.search).get('core'),
            path: window.location.origin + '/emulator/',
            container: 'game-container', // Forçando o ID aqui
            extra: { forceSingleThread: false }
        };
    </script>
    <script src="/emulator/loader.js"></script>
</body>
</html>
