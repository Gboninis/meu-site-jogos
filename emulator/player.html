<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EmulatorJS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        // Configuração do EmulatorJS
        window.EJS_player = {
            gameUrl: new URLSearchParams(window.location.search).get('game'),
            core: new URLSearchParams(window.location.search).get('core'),
            path: 'https://cdn.emulatorjs.org/stable/', // Usa o CDN oficial para evitar erro de arquivos WASM locais
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
