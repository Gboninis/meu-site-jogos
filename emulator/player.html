<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Jogo...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body style="background-color: black;">
    <div id="game"></div>
    
    <script>
        function loadGame() {
            const urlParams = new URLSearchParams(window.location.search);
            const gameUrl = urlParams.get('game');
            const core = urlParams.get('core') || 'nes';

            if (!gameUrl) {
                alert("Nenhum jogo foi selecionado!");
                return;
            }

            window.EJS_player = {
                gameUrl: gameUrl, 
                core: core,
                parent: document.getElementById('game'),
                // Aqui tentamos apontar para a pasta cores que você possui
                path: 'emulator/' 
            };
        }

        loadGame();
    </script>
    <script src="emulator.min.js"></script>
</body>
</html>
