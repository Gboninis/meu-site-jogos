<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EmulatorJS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        // Pegamos os dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const game = urlParams.get('game');
        const core = urlParams.get('core');

        // Forçamos a configuração global que o motor busca
        window.EJS_player = {
            gameUrl: game,
            coreUrl: core,
            divId: 'game' 
        };
    </script>

    <!-- Carregamos o motor -->
    <script src="/emulator/loader.js"></script>
</body>
</html>
