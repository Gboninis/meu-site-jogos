<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EmulatorJS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        // Configuração do EmulatorJS
        window.EJS_player = (() => {
            const params = new URLSearchParams(window.location.search);
            let game = params.get('game');
            let core = params.get('core');

            // Auto-correção: Se a ROM é .nes mas o core é snes, corrige para nes
            if (game && game.endsWith('.nes') && core === 'snes') {
                core = 'nes';
            }

            return {
                gameUrl: game,
                core: core,
                path: 'https://cdn.emulatorjs.org/stable/',
            };
        })();
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
