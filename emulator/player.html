<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de Vida Emulator</title>
</head>
<body style="background:black;margin:0;">
    <div id="game-container" style="width:100vw;height:100vh;"></div>

    <script>
        alert("O HTML carregou!");

        window.EJS_player = {
            gameUrl: String(new URLSearchParams(window.location.search).get('game')),
            core: String(new URLSearchParams(window.location.search).get('core')),
            path: '/emulator/', 
            // Mudança crucial aqui: forçando a string de forma absoluta
            container: String('game-container'), 
            extra: { 
                forceSingleThread: false,
                debug: true 
            }
        };
    </script>
    
    <script src="/emulator/loader.js"></script>
