<!DOCTYPE html>
<html>
<head>
    <title>Emulator</title>
    <style>body, html, #game { margin: 0; padding: 0; width: 100%; height: 100%; background: black; }</style>
</head>
<body>
    <div id="game"></div>
    <script>
        window.EJS_player = {
            gameUrl: new URLSearchParams(window.location.search).get('game'),
            core: new URLSearchParams(window.location.search).get('core'),
            path: window.location.origin + '/emulator/',
            extra: { forceSingleThread: false }
        };
    </script>
    <script src="/emulator/loader.js"></script>
</body>
</html>
