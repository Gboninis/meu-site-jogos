<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>EmulatorJS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body style="background-color: black;">
    <div id="game"></div>
    <script>
        window.EJS_player = {
            gameUrl: new URLSearchParams(window.location.search).get('game'),
            core: new URLSearchParams(window.location.search).get('core'),
            // Aqui está o segredo: usamos o loader da internet, mas mandamos ele buscar os arquivos no SEU site
            path: window.location.origin + '/emulator/', 
            extra: {
                onLoad: function() {
                    console.log("Jogo carregado!");
                }
            }
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
