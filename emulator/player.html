<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Jogo...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game"></div>
    
    <script>
        async function loadGame() {
            const urlParams = new URLSearchParams(window.location.search);
            const gameUrl = urlParams.get('game');
            const core = urlParams.get('core') || 'nes';

            if (!gameUrl) {
                alert("Nenhum jogo foi selecionado!");
                return;
            }

            try {
                // Baixa a ROM via proxy e transforma em um arquivo temporário (Blob)
                const response = await fetch(gameUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                // Injeta a ROM diretamente na configuração do motor
                window.EJS_player = {
                    gameUrl: blobUrl,
                    core: core,
                    parent: document
                };
            } catch (e) {
                console.error("Erro crítico ao carregar ROM:", e);
            }
        }

        loadGame();
    </script>
    <script src="emulator.min.js"></script>
</body>
</html>
